<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسة الاستشارة الطبية - العيادة</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-body, 'Inter', sans-serif);
    }
    .video-header {
      background: #111827;
      padding: 0.7rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .video-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .rec-dot {
      width: 10px; height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .video-info { font-size: 0.82rem; color: #94a3b8; }
    #jitsi-iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }
    .leave-btn {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .leave-btn:hover { background: rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <header class="video-header">
    <div class="video-title">
      <div class="rec-dot"></div>
      <span>غرفة الاستشارة الطبية الافتراضية</span>
    </div>
    <div class="video-info">
      رقم الجلسة: <strong id="ref-label" style="font-family:monospace; color:#38bdf8;">...</strong>
    </div>
    <button class="leave-btn" onclick="window.close()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> مغادرة
    </button>
  </header>

  <iframe
    id="jitsi-iframe"
    allow="camera; microphone; display-capture; fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    src="">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref  = params.get('ref')  || 'demo';
    const role = params.get('role') || 'patient';

    document.getElementById('ref-label').textContent = ref;

    // Build safe room name from ref
    const roomName = 'ClinicConsult-' + ref.replace(/[^a-zA-Z0-9]/g, '');
    const displayName = role === 'doctor' ? 'الطبيب المعالج' : 'المريض';

    // Use direct Jitsi URL embed (no external_api.js needed - avoids chrome extension errors)
    const jitsiUrl = `https://meet.jit.si/${encodeURIComponent(roomName)}#` +
      `userInfo.displayName=${encodeURIComponent(displayName)}` +
      `&config.startWithAudioMuted=false` +
      `&config.startWithVideoMuted=false` +
      `&config.enableWelcomePage=false` +
      `&config.prejoinPageEnabled=true` +
      `&interfaceConfig.SHOW_JITSI_WATERMARK=false` +
      `&interfaceConfig.SHOW_BRAND_WATERMARK=false`;

    document.getElementById('jitsi-iframe').src = jitsiUrl;
  </script>
</body>
</html>
