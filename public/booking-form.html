<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الحجز - العيادة</title>
  <meta name="description" content="أدخل بياناتك الشخصية لإتمام حجز موعدك">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    .portal-nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11,15,25,.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      padding: .9rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .portal-logo { display:flex;align-items:center;gap:.75rem;font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--text-primary); }
    .portal-logo-icon { width:38px;height:38px;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff; }

    .breadcrumb { display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--text-muted);margin-bottom:1.5rem; }
    .breadcrumb a { color:var(--text-muted); }
    .breadcrumb a:hover { color:var(--primary-color); }
    .breadcrumb i { font-size:.7rem; }

    /* Progress steps */
    .booking-steps {
      display: flex; align-items: center; justify-content: center;
      gap: .5rem; margin-bottom: 2.5rem; flex-wrap: wrap;
    }
    .step {
      display: flex; align-items: center; gap: .4rem;
      font-size: .82rem; font-weight: 600;
      color: var(--text-muted);
    }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 700;
      transition: all .2s;
    }
    .step.done .step-num { background: var(--success); border-color: var(--success); color: #fff; }
    .step.active .step-num { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
    .step.active { color: var(--text-primary); }
    .step-sep { width: 32px; height: 2px; background: var(--border-color); border-radius: 2px; }
    .step.done + .step-sep, .step.done ~ .step-sep { background: var(--success); }

    /* Layout */
    .booking-layout {
      max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
      display: grid; grid-template-columns: 1fr 300px; gap: 1.75rem; align-items: start;
    }
    @media(max-width:820px) { 
      .booking-layout { grid-template-columns:1fr; padding: 1rem .75rem 2.5rem; gap: 1.25rem; } 
      .booking-sidebar { order:-1; } 
      .card, .doc-sidebar-card { padding: 1rem !important; }
    }
    @media(max-width:480px) {
      .portal-nav { padding: .75rem; }
      .booking-steps { gap: .25rem; font-size: .75rem; margin-bottom: 1.5rem; }
      .step-sep { width: 12px; }
      .step-num { width: 22px; height: 22px; font-size: .7rem; }
      .gender-options { gap: .5rem; flex-direction: column; }
      .payment-method-option { padding: .75rem; gap: .5rem; }
      .payment-method-icon { width: 32px; height: 32px; font-size: 1rem; }
      .form-group { margin-bottom: 1rem; }
      .form-label { font-size: 0.85rem; margin-bottom: 0.35rem; }
      .form-input { padding: 0.6rem 0.75rem; font-size: 0.9rem; }
      .proceed-btn { padding: 0.75rem; font-size: 0.95rem; }
      .doc-sidebar-avatar { width: 65px; height: 65px; font-size: 1.5rem; }
      .summary-row { font-size: 0.85rem; padding: 0.5rem 0; }
      h1 { font-size: 1.35rem !important; }
      .name-grid { grid-template-columns: 1fr !important; }
      .submit-btn { min-height: 48px; }
    }

    /* Payment method cards */
    .payment-methods { display:flex;flex-direction:column;gap:.75rem; }
    .payment-method-option {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem;
      border: 2px solid var(--border-color);
      border-radius: 12px; cursor: pointer;
      transition: all .2s;
      background: var(--bg-input);
    }
    .payment-method-option:hover { border-color: var(--primary-color); }
    .payment-method-option.selected { border-color: var(--primary-color); background: rgba(79,70,229,.07); }
    .payment-method-option input[type="radio"] { display:none; }
    .payment-method-icon { width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.25rem; }
    .payment-method-details .pm-name { font-weight:700;font-size:.95rem; }
    .payment-method-details .pm-desc { font-size:.8rem;color:var(--text-muted);margin-top:.15rem; }
    .payment-check { margin-right:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:.2s; }
    .payment-method-option.selected .payment-check { border-color:var(--primary-color);background:var(--primary-color);color:#fff; }

    /* Sidebar summary */
    .booking-sidebar { position:sticky;top:80px; }
    .summary-card { background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem; }
    .summary-title { font-family:var(--font-display);font-weight:700;font-size:1rem;border-bottom:1px solid var(--border-color);padding-bottom:.75rem; }
    .summary-row { display:flex;justify-content:space-between;align-items:center;font-size:.88rem;padding:.35rem 0; }
    .summary-label { color:var(--text-muted); }
    .summary-val { font-weight:600; }
    .summary-total { display:flex;justify-content:space-between;align-items:center;font-size:1rem;padding:.75rem 0 0;border-top:2px solid var(--border-color);margin-top:.25rem; }
    .summary-total .summary-val { font-size:1.3rem;color:var(--secondary-color);font-family:var(--font-display); }

    .submit-btn { width:100%;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));color:#fff;border:none;border-radius:10px;padding:.9rem;font-family:var(--font-display);font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem; }
    .submit-btn:hover { filter:brightness(1.1);transform:translateY(-1px); }
    .submit-btn:disabled { opacity:.4;cursor:not-allowed;transform:none; }

    /* Status bar */
    .status-bar { padding:.75rem 1rem;border-radius:8px;font-size:.9rem;margin-bottom:1.25rem;display:none; }
    .status-bar.error   { background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--danger); }
    .status-bar.info    { background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:var(--info); }

    /* Gender select cards */
    .gender-options { display:flex;gap:.75rem; }
    .gender-option { flex:1;padding:.65rem;border:2px solid var(--border-color);border-radius:10px;cursor:pointer;text-align:center;font-size:.88rem;font-weight:600;color:var(--text-muted);transition:.2s; }
    .gender-option:hover { border-color:var(--border-hover);color:var(--text-primary); }
    .gender-option.selected { border-color:var(--primary-color);background:rgba(79,70,229,.08);color:var(--primary-color); }
    .gender-option input { display:none; }
  </style>
</head>
<body class="dark-theme">

  <!-- Navbar -->
  <nav class="portal-nav">
    <div class="portal-logo">
      <div class="portal-logo-icon" id="nav-logo-container">
        <i class="fa-solid fa-hospital"></i>
      </div>
      <span id="clinic-name">العيادة</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a id="back-btn" href="index.html" class="btn btn-secondary" style="padding:.5rem 1rem;font-size:.85rem; z-index: 10;">
        <i class="fa-solid fa-arrow-right"></i> الرجوع
      </a>
      <img src="../logo_sm.png" alt="Logo" style="max-height: 36px; width: auto; object-fit: contain; z-index: 1;">
    </div>
  </nav>

  <div style="max-width:1000px;margin:0 auto;padding:2rem 1.5rem .5rem;">
    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html">الرئيسية</a>
      <i class="fa-solid fa-chevron-left"></i>
      <a id="bc-doctors-link" href="#">الأطباء</a>
      <i class="fa-solid fa-chevron-left"></i>
      <span>تفاصيل الحجز</span>
    </div>

    <!-- Steps -->
    <div class="booking-steps">
      <div class="step done"><div class="step-num"><i class="fa-solid fa-check"></i></div> التخصص والطبيب</div>
      <div class="step-sep"></div>
      <div class="step done"><div class="step-num"><i class="fa-solid fa-check"></i></div> اختيار الموعد</div>
      <div class="step-sep"></div>
      <div class="step active"><div class="step-num">3</div> بيانات الحجز</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">4</div> التأكيد</div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="booking-layout">

    <!-- Form -->
    <div>
      <!-- Status -->
      <div id="booking-status" class="status-bar"></div>

      <form id="bookingForm" novalidate>

        <!-- Personal Info -->
        <div class="card flex flex-col gap-4" style="margin-bottom:1.25rem;">
          <h3 style="font-family:var(--font-display);font-size:1.1rem;border-bottom:1px solid var(--border-color);padding-bottom:.75rem;">
            <i class="fa-solid fa-user" style="color:var(--primary-color);margin-left:.5rem;"></i> البيانات الشخصية
          </h3>

          <div class="grid gap-4" style="grid-template-columns:1fr 1fr;" class="name-grid">
            <div class="form-group" style="grid-column: auto;">
              <label for="patientFirstName" class="form-label">الاسم الأول <span style="color:var(--danger)">*</span></label>
              <input type="text" id="patientFirstName" class="form-input" placeholder="محمد" required>
            </div>
            <div class="form-group" style="grid-column: auto;">
              <label for="patientLastName" class="form-label">اسم العائلة <span style="color:var(--danger)">*</span></label>
              <input type="text" id="patientLastName" class="form-input" placeholder="أحمد" required>
            </div>
          </div>
          <style>@media(max-width:400px){.name-grid{grid-template-columns:1fr!important;}}</style>

          <div class="form-group">
            <label for="patientPhone" class="form-label">رقم الهاتف <span style="color:var(--danger)">*</span></label>
            <input type="tel" id="patientPhone" class="form-input" placeholder="01012345678" required>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="card flex flex-col gap-4">
          <h3 style="font-family:var(--font-display);font-size:1.1rem;border-bottom:1px solid var(--border-color);padding-bottom:.75rem;">
            <i class="fa-solid fa-credit-card" style="color:var(--secondary-color);margin-left:.5rem;"></i> طريقة الدفع
          </h3>

          <div class="payment-methods">
            <!-- Online Payment -->
            <label class="payment-method-option" id="pm-online" onclick="selectPayment('online')">
              <input type="radio" name="paymentMethod" value="online">
              <div class="payment-method-icon" style="background:rgba(6,182,212,.12);color:var(--secondary-color);">
                <i class="fa-solid fa-credit-card"></i>
              </div>
              <div class="payment-method-details">
                <div class="pm-name">الدفع الإلكتروني</div>
                <div class="pm-desc">بطاقة بنكية أو محفظة إلكترونية عبر Paymob</div>
              </div>
              <div class="payment-check"><i class="fa-solid fa-check"></i></div>
            </label>

            <!-- Cash -->
            <label class="payment-method-option selected" id="pm-cash" onclick="selectPayment('cash')">
              <input type="radio" name="paymentMethod" value="cash" checked>
              <div class="payment-method-icon" style="background:rgba(16,185,129,.12);color:var(--success);">
                <i class="fa-solid fa-money-bill-wave"></i>
              </div>
              <div class="payment-method-details">
                <div class="pm-name">الدفع عند الحضور</div>
                <div class="pm-desc">ادفع نقداً في العيادة يوم موعدك</div>
              </div>
              <div class="payment-check"><i class="fa-solid fa-check"></i></div>
            </label>
          </div>

          <!-- Paymob iframe container (hidden unless online selected) -->
          <div id="paymob-container" style="display:none;border-radius:12px;overflow:hidden;border:1px solid var(--border-color);">
            <iframe id="paymob-iframe" style="width:100%;height:500px;border:none;" title="بوابة الدفع"></iframe>
          </div>
        </div>

      </form>
    </div>

    <!-- Summary Sidebar -->
    <div class="booking-sidebar">
      <div class="summary-card">
        <div class="summary-title"><i class="fa-solid fa-receipt" style="margin-left:.4rem;color:var(--primary-color);"></i> ملخص الحجز</div>

        <div>
          <div class="summary-row">
            <span class="summary-label">الطبيب</span>
            <span class="summary-val" id="sum-doctor">--</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">التخصص</span>
            <span class="summary-val" id="sum-specialty">--</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">التاريخ</span>
            <span class="summary-val" id="sum-date">--</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">الوقت</span>
            <span class="summary-val" id="sum-time">--</span>
          </div>
        </div>

        <div class="summary-total">
          <span style="font-weight:700;">الإجمالي</span>
          <span class="summary-val" id="sum-price">-- ج.م</span>
        </div>

        <button id="confirm-booking-btn" class="submit-btn" type="button" onclick="submitBooking()">
          <i class="fa-solid fa-calendar-check"></i> تأكيد الحجز
        </button>

        <p style="text-align:center;font-size:.78rem;color:var(--text-muted);">
          <i class="fa-solid fa-shield-halved" style="color:var(--success);"></i>
          بياناتك محمية وآمنة تماماً
        </p>
      </div>
    </div>
  </div>

  <script src="../js/env.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/booking.js"></script>
  <script src="../js/paymob.js"></script>
  <footer style="margin-top: 3rem; padding: 1.5rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); max-width: 1100px; margin-left: auto; margin-right: auto;">
    <div>© 2026 إدارة العيادة. جميع الحقوق محفوظة.</div>
    <img src="../logo_sm.png" alt="Logo" style="max-height: 32px; width: auto; object-fit: contain;">
  </footer>
</body>
</html>
